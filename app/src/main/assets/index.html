<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071525">
<title>АстроПрыг</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071525;touch-action:none;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#game{display:block;width:100%;height:100%;object-fit:contain;background:#071525}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#071525;color:white;font-family:Arial,sans-serif;z-index:10}
#boot b{font-size:32px;margin-bottom:12px}#boot span{opacity:.7}
</style>
</head>
<body>
<canvas id="game" width="540" height="960" aria-label="Игра АстроПрыг"></canvas>
<div id="boot"><b>АСТРОПРЫГ</b><span>Подготовка полёта…</span></div>
<script src="game.js"></script>
</body>
</html>
