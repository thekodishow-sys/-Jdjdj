name: Build AstroPryg Final Prototype APK

on:
  push:
    branches:
      - astropyg-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/src app/src/main/assets/vendor
          cat buildsrc/game.part00 buildsrc/game.part01 buildsrc/game.part02 buildsrc/game.part03 buildsrc/game.part04 buildsrc/game.part05 | tr -d '\n\r ' | base64 -d > app/src/main/assets/src/game.js
          node --check app/src/main/assets/src/game.js
          curl -L --fail --retry 3 --connect-timeout 15 "https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" -o app/src/main/assets/vendor/phaser.min.js ||           curl -L --fail --retry 3 --connect-timeout 15 "https://unpkg.com/phaser@3.90.0/dist/phaser.min.js" -o app/src/main/assets/vendor/phaser.min.js
          test -s app/src/main/assets/vendor/phaser.min.js
          test -s app/src/main/assets/src/game.js
          echo "Game bytes: $(wc -c < app/src/main/assets/src/game.js)"
          echo "Phaser bytes: $(wc -c < app/src/main/assets/vendor/phaser.min.js)"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/vendor/phaser.min.js"
          unzip -l "$APK" | grep -q "assets/src/game.js"
          unzip -l "$APK" | grep -q "assets/index.html"
          ls -lh "$APK"

      - name: Upload final prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroPryg-final-prototype-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
