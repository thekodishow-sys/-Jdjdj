name: Build AstroPryg from Munch Jump

on:
  push:
    branches: [astropyg-github-copy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare original MIT game
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/munch-jump
          git clone https://github.com/chipjacks/munch-jump.git /tmp/munch-jump
          cd /tmp/munch-jump
          git checkout 58186ccbeca46cb3a9c7e260888c7437e22bd9cd
          cd "$GITHUB_WORKSPACE"

          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/vendor app/src/main/res/drawable
          cp -a /tmp/munch-jump/. app/src/main/assets/
          rm -rf app/src/main/assets/.git

          curl -L --fail --retry 3 "https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"             -o app/src/main/assets/vendor/p5.min.js
          curl -L --fail --retry 3 "https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"             -o app/src/main/assets/vendor/p5.sound.min.js

          cp /tmp/munch-jump/images/alison_favicon.png app/src/main/res/drawable/ic_launcher.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/assets")

          p = root / "index.html"
          s = p.read_text()
          s = s.replace(
              'https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.js',
              'vendor/p5.min.js'
          )
          s = s.replace(
              'https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.js',
              'vendor/p5.sound.min.js'
          )
          s = s.replace('<title>Munch Jump</title>', '<title>АстроПрыг</title>')
          s = s.replace('href="/images/doodle_farting.png"', 'href="images/doodle_farting.png"')

          controls = """
          <script>
          window.touchDirection = 0;
          (function(){
            function dir(e){
              if (e.target && e.target.id === 'permissionButton') return;
              window.touchDirection = e.clientX < window.innerWidth / 2 ? -1 : 1;
            }
            window.addEventListener('pointerdown', dir, {passive:true});
            window.addEventListener('pointermove', function(e){ if(e.buttons || e.pointerType === 'touch') dir(e); }, {passive:true});
            window.addEventListener('pointerup', function(){ window.touchDirection = 0; }, {passive:true});
            window.addEventListener('pointercancel', function(){ window.touchDirection = 0; }, {passive:true});
            window.addEventListener('blur', function(){ window.touchDirection = 0; });
          })();
          </script>
          """
          s = s.replace('<script type="module" src="src/Game.js"></script>', controls + '\n    <script type="module" src="src/Game.js"></script>')
          p.write_text(s)

          p = root / "src" / "Doodle.js"
          s = p.read_text()
          pattern = r"\t_updateX\(\) \{.*?\n\t\}\n\n\tcorners\(\)"
          replacement = """\t_updateX() {
          \t\tconst td = Number(window.touchDirection || 0);
          \t\tif (keyIsDown(LEFT_ARROW) === true || td < 0) {
          \t\t\tthis.x -= DOODLE.MOVE_SPEED;
          \t\t} else if (keyIsDown(RIGHT_ARROW) === true || td > 0) {
          \t\t\tthis.x += DOODLE.MOVE_SPEED;
          \t\t}
          \t\tif (this.x >= width) {
          \t\t\tthis.x = this.x % width;
          \t\t} else if (this.x <= 0) {
          \t\t\tthis.x = width + this.x;
          \t\t}
          \t}

          \tcorners()"""
          s2, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f"Could not patch Doodle.js updateX, matches={n}")
          p.write_text(s2)

          p = root / "src" / "Game.js"
          s = p.read_text()
          s = s.replace('Arrow keys or rotate device to move', 'Touch left / right side to move')
          s = s.replace('if (!checkPermissionGranted()) {', 'if (false) {')
          p.write_text(s)
          PY

          node --check app/src/main/assets/src/main.js
          node --check app/src/main/assets/src/Doodle.js
          node --check app/src/main/assets/src/Platforms.js
          test -s app/src/main/assets/images/doodle.png
          test -s app/src/main/assets/audio/background.mp3
          test -s app/src/main/assets/vendor/p5.min.js
          test -s app/src/main/assets/vendor/p5.sound.min.js

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains the copied game
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/images/doodle.png"
          unzip -l "$APK" | grep -q "assets/images/title.png"
          unzip -l "$APK" | grep -q "assets/audio/background.mp3"
          unzip -l "$APK" | grep -q "assets/src/Game.js"
          unzip -l "$APK" | grep -q "assets/vendor/p5.min.js"
          echo "APK verified:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroPryg-GitHub-Copy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
