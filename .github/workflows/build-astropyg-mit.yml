name: Build AstroPryg MIT Rebuild APK
on:
  push:
    branches: [astropyg-mit-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate game JavaScript
        run: node --check app/src/main/assets/game.js
      - name: Install Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/game.js"
          unzip -l "$APK" | grep -q "assets/index.html"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: AstroPryg-MIT-Rebuild-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
